<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Fahmida Alam Mimi · Frontend Developer & React Enthusiast</title>
    <meta
      name="description"
      content="Portfolio of Fahmida Alam Mimi — an aspiring frontend developer building responsive web experiences with React, TypeScript, Tailwind CSS and AI-assisted development."
    />
    <meta name="author" content="Fahmida Alam Mimi" />
    <meta name="theme-color" content="#fff7e6" />
    <link rel="canonical" href="https://your-domain.example/" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Fahmida Alam Mimi · Frontend Developer" />
    <meta
      property="og:description"
      content="Aspiring frontend developer building responsive web experiences with React, TypeScript, Tailwind CSS and AI-assisted development."
    />
    <meta property="og:url" content="https://your-domain.example/" />
    <meta property="og:image" content="https://your-domain.example/images/og-image.png" />
    <meta property="og:site_name" content="Fahmida Alam Mimi" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fahmida Alam Mimi · Frontend Developer" />
    <meta
      name="twitter:description"
      content="Aspiring frontend developer building responsive web experiences with React, TypeScript, Tailwind CSS and AI-assisted development."
    />
    <meta name="twitter:image" content="https://your-domain.example/images/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />

    <!-- Fonts: Space Grotesk (headings) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Apply the saved theme before the app renders to avoid a flash of the wrong theme -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme = stored ? stored : prefersDark ? 'dark' : 'light'
          document.documentElement.classList.toggle('dark', theme === 'dark')
          document.documentElement.style.colorScheme = theme
        } catch (e) {
          /* no-op */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
